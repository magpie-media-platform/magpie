x-database-connection: &database-connection "Server=sqlserver;Database=Magpie;User Id=sa;Password=Integration-suite-pa55!;TrustServerCertificate=True"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Integration-suite-pa55!"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 20s
    restart: "no"

  magpie:
    environment:
      Magpie__Database__Provider: sqlserver
      Magpie__Database__ConnectionString: *database-connection
    depends_on:
      sqlserver:
        condition: service_healthy

  tests:
    environment:
      Magpie__Database__Provider: sqlserver
      Magpie__Database__ConnectionString: *database-connection
      MAGPIE_DATABASE_PROVIDER_NAME: MSSQL

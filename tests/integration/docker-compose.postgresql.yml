x-database-connection: &database-connection "Host=postgresql;Database=magpie;Username=postgres;Password=integration-suite-pa55"

services:
  postgresql:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: integration-suite-pa55
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"

  magpie:
    environment:
      Magpie__Database__Provider: postgresql
      Magpie__Database__ConnectionString: *database-connection
    depends_on:
      postgresql:
        condition: service_healthy

  tests:
    environment:
      Magpie__Database__Provider: postgresql
      Magpie__Database__ConnectionString: *database-connection
      MAGPIE_DATABASE_PROVIDER_NAME: PostgreSQL

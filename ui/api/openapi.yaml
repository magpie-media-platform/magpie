    # Filter Query request/response types
    FilterQueryParseRequest:
      type: object
      required: [query]
      description: Request to parse a filter query string into criteria
      properties:
        query:
          type: string
          description: The query string to parse

    FilterQueryErrorResponse:
      type: object
      required: [message, position, expected]
      description: Response returned when a filter query fails to parse
      properties:
        message:
          type: string
          description: The error message
        position:
          type: integer
          description: The position in the query string where the error occurred
        expected:
          type: array
          items:
            type: string
          description: The tokens or expressions expected at the error position

    FilterQueryFormatResponse:
      type: object
      required: [query]
      description: Response containing a formatted filter query string
      properties:
        query:
          type: string
          description: The formatted query string

    # Connection test result
    ConnectionTestResult:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          description: Whether the connection test succeeded
        message:
          type: string
          description: A human-readable message describing the result


  # Filter Query (parse/format)
  /filter-query/content/parse:
    post:
      operationId: ParseContentFilterQuery
      tags: [ContentFilters]
      summary: Parse a content filter query string into criteria
      description: |
        Parses a filter query string (e.g., "genre has 'Action' and monitoring = Active")
        into a ContentFilterCriteria object. Returns 400 if the query has syntax errors.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterQueryParseRequest'
            example:
              query: "monitoring = Active and tag has 'HD'"
      responses:
        '200':
          description: Query parsed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentFilterCriteria'
              example:
                contentHierarchyItem:
                  and:
                    - monitoring:
                        equals:
                          value: 1
                    - tags:
                        has:
                          value: "HD"
        '400':
          description: Query parse error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterQueryErrorResponse'
              example:
                message: "Unexpected token"
                position: 15
                expected: ["operator", "and", "or"]

  /filter-query/content/format:
    post:
      operationId: FormatContentFilterCriteria
      tags: [ContentFilters]
      summary: Format content filter criteria as a query string
      description: |
        Converts a ContentFilterCriteria object into a human-readable query string.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentFilterCriteria'
      responses:
        '200':
          description: Criteria formatted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterQueryFormatResponse'
              example:
                query: "monitoring = Active and tag has 'HD'"

  /filter-query/subject/parse:

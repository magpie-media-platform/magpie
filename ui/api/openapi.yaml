openapi: 3.0.3
info:
  title: Magpie API
  version: v1
  description: |
    Magpie media automation platform API.

    This spec is used for mock API development with Prism.
    Sync with the real API by running the backend and fetching /swagger/v1/swagger.json.

servers:
  - url: http://localhost:4010
    description: Prism mock server
  - url: http://localhost:5000/api
    description: Local development server

tags:
  - name: System
    description: System health and information
  - name: Users
    description: User management (Admin only)
  - name: Auth
    description: Authentication
  - name: Tags
    description: Tag management
  - name: RootFolders
    description: Root folder management
  - name: Settings
    description: Application settings
  - name: Indexers
    description: Indexer management
  - name: DownloadClients
    description: Download client management
  - name: MediaServers
    description: Media server management
  - name: Downloads
    description: Download queue management
  - name: Jobs
    description: Job execution and templates
  - name: QualityTiers
    description: Quality tier management
  - name: Wishlists
    description: Wishlist management
  - name: Subjects
    description: Subject/metadata management
  - name: Content
    description: Content hierarchy management
  - name: Extensions
    description: Extension management
  - name: UI
    description: UI extension manifest
  - name: ContentFilters
    description: Content filter management
  - name: SubjectFilters
    description: Subject filter management
  - name: ScheduleTriggers
    description: Schedule trigger management
  - name: EventTriggers
    description: Event trigger management
  - name: IndexerFeeds
    description: Indexer feed management
  - name: ApiKeys
    description: API key management
  - name: Releases
    description: Release management
  - name: Backups
    description: Database backup management (Admin only)
  - name: FileBrowser
    description: File system browsing

paths:
  /system/health:
    get:
      operationId: GetHealth
      tags: [System]
      summary: Get system health status
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: healthy

  /system/health/database:
    get:
      operationId: GetDatabaseHealth
      tags: [System]
      summary: Check database connectivity
      responses:
        '200':
          description: Database health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHealthResponse'
              example:
                name: SQLite
                status: healthy
                message: Database connection successful
                responseTimeMs: 12

  /system/health/scheduler:
    get:
      operationId: GetSchedulerHealth
      tags: [System]
      summary: Check scheduler infrastructure
      responses:
        '200':
          description: Scheduler health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHealthResponse'
              example:
                name: Scheduler
                status: healthy
                message: "Scheduler infrastructure accessible, 3 due trigger(s)"
                responseTimeMs: 5

  /system/info:
    get:
      operationId: GetInfo
      tags: [System]
      summary: Get system information
      responses:
        '200':
          description: System information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
              example:
                version: "1.0.0"
                runtime: ".NET 10.0.0"
                operatingSystem: "Windows 11"
                architecture: "X64"
                startedAt: "2025-01-15T10:30:00Z"

  /system/disk-space:
    get:
      operationId: GetDiskSpace
      tags: [System]
      summary: Get disk space information for root folders
      responses:
        '200':
          description: Disk space information per root folder
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiskSpaceInfo'
              example:
                - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  name: "Movies"
                  path: "/media/movies"
                  totalBytes: 1000000000000
                  freeBytes: 500000000000
                  usedBytes: 500000000000
                - id: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                  name: "TV Shows"
                  path: "/media/tv"
                  totalBytes: 2000000000000
                  freeBytes: 1500000000000
                  usedBytes: 500000000000

  /users:
    get:
      operationId: GetAllUsers
      tags: [Users]
      summary: Get all users
      parameters:
        - name: providerType
          in: query
          required: false
          schema:
            type: string
          description: Filter by authentication provider type
        - name: role
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Role'
          description: Filter by user role
        - name: enabled
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by enabled status
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Page number
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 25
          description: Number of items per page
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
          description: Property name to sort by
        - name: sortDirection
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SortDirection'
          description: Sort direction
      responses:
        '200':
          description: Paged list of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedUsers'
              example:
                items:
                  - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    username: "admin"
                    email: "admin@example.com"
                    extensionId: null
                    providerType: "local"
                    externalId: null
                    enabled: true
                    role: 3
                    settings: null
                    lastLoginAt: "2024-01-15T10:30:00Z"
                    createdAt: "2024-01-01T00:00:00Z"
                    createdByUserId: null
                    modifiedAt: null
                    modifiedByUserId: null
                pageNumber: 1
                pageSize: 25
                totalItems: 1
    post:
      operationId: CreateUser
      tags: [Users]
      summary: Create a new local user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
            example:
              username: "newuser"
              password: "plaintextpassword"
              role: 1
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                username: "newuser"
                email: null
                extensionId: null
                providerType: "local"
                externalId: null
                enabled: true
                role: 1
                settings: null
                lastLoginAt: null
                createdAt: "2024-01-15T10:30:00Z"
                createdByUserId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                modifiedAt: null
                modifiedByUserId: null
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /users/{id}:
    get:
      operationId: GetUserById
      tags: [Users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                username: "admin"
                email: "admin@example.com"
                extensionId: null
                providerType: "local"
                externalId: null
                enabled: true
                role: 3
                settings: null
                lastLoginAt: "2024-01-15T10:30:00Z"
                createdAt: "2024-01-01T00:00:00Z"
                createdByUserId: null
                modifiedAt: null
                modifiedByUserId: null
        '404':
          description: User not found
    patch:
      operationId: PatchUser
      tags: [Users]
      summary: Partially update a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        '204':
          description: User updated
        '404':
          description: User not found
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      operationId: DeleteUser
      tags: [Users]
      summary: Delete a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deleted
        '404':
          description: User not found

  /users/{id}/enable:
    post:
      operationId: EnableUser
      tags: [Users]
      summary: Enable a user account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                username: "admin"
                email: "admin@example.com"
                extensionId: null
                providerType: "local"
                externalId: null
                enabled: true
                role: 3
                settings: null
                lastLoginAt: "2024-01-15T10:30:00Z"
                createdAt: "2024-01-01T00:00:00Z"
                createdByUserId: null
                modifiedAt: "2024-01-15T10:35:00Z"
                modifiedByUserId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        '404':
          description: User not found

  /users/{id}/disable:
    post:
      operationId: DisableUser
      tags: [Users]
      summary: Disable a user account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                username: "admin"
                email: "admin@example.com"
                extensionId: null
                providerType: "local"
                externalId: null
                enabled: false
                role: 3
                settings: null
                lastLoginAt: "2024-01-15T10:30:00Z"
                createdAt: "2024-01-01T00:00:00Z"
                createdByUserId: null
                modifiedAt: "2024-01-15T10:35:00Z"
                modifiedByUserId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        '404':
          description: User not found

  /users/me:
    get:
      operationId: GetCurrentUser
      tags: [Users]
      summary: Get current authenticated user
      responses:
        '200':
          description: Current user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                username: "admin"
                email: "admin@example.com"
                authProviderId: null
                externalId: null
                enabled: true
                role: 3
                providerData: null
                lastLoginAt: "2024-01-15T10:30:00Z"
                createdAt: "2024-01-01T00:00:00Z"
                createdByUserId: null
                modifiedAt: null
                modifiedByUserId: null
        '401':
          description: Not authenticated

  /tags:
    get:
      operationId: GetAllTags
      tags: [Tags]
      summary: Get all tags
      responses:
        '200':
          description: List of tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
              example:
                - id: "11111111-1111-1111-1111-111111111111"
                  name: "4K"
                  createdAt: "2024-01-01T00:00:00Z"
                  createdByUserId: null
                  modifiedAt: null
                  modifiedByUserId: null
                - id: "22222222-2222-2222-2222-222222222222"
                  name: "HDR"
                  createdAt: "2024-01-01T00:00:00Z"
                  createdByUserId: null
                  modifiedAt: null
                  modifiedByUserId: null

  /root-folders:
    get:
      operationId: GetAllRootFolders
      tags: [RootFolders]
      summary: Get all root folders
      responses:
        '200':
          description: List of root folders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RootFolder'
              example:
                - id: "11111111-1111-1111-1111-111111111111"
                  name: "Movies"
                  path: "/media/movies"
                  contentTypeId: "movies"
                  createdAt: "2024-01-01T00:00:00Z"
                  createdByUserId: null
                  modifiedAt: null
                  modifiedByUserId: null
                - id: "22222222-2222-2222-2222-222222222222"
                  name: "TV Shows"
                  path: "/media/tv"
                  contentTypeId: "episodes"
                  createdAt: "2024-01-01T00:00:00Z"
                  createdByUserId: null
                  modifiedAt: null
                  modifiedByUserId: null
    post:
      operationId: CreateRootFolder
      tags: [RootFolders]
      summary: Create a new root folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RootFolder'
      responses:
        '201':
          description: Root folder created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootFolder'
              example:
                id: "33333333-3333-3333-3333-333333333333"
                name: "Music"
                path: "/media/music"
                contentTypeId: "music"
                createdAt: "2024-01-15T10:30:00Z"
                createdByUserId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                modifiedAt: null
                modifiedByUserId: null
        '400':
          description: Bad request

  /root-folders/{id}:
    get:
      operationId: GetRootFolderById
      tags: [RootFolders]
      summary: Get root folder by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Root folder details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootFolder'
              example:
                id: "11111111-1111-1111-1111-111111111111"
                name: "Movies"
                path: "/media/movies"
                contentTypeId: "movies"
                createdAt: "2024-01-01T00:00:00Z"
                createdByUserId: null
                modifiedAt: null
                modifiedByUserId: null
        '404':
          description: Root folder not found
    patch:
      operationId: UpdateRootFolder
      tags: [RootFolders]
      summary: Update a root folder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RootFolder'
      responses:
        '204':
          description: Root folder updated
        '404':
          description: Root folder not found
    delete:
      operationId: DeleteRootFolder
      tags: [RootFolders]
      summary: Delete a root folder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Root folder deleted
        '404':
          description: Root folder not found

  /settings/groups:
    get:
      operationId: GetAllSettingsGroups
      tags: [Settings]
      summary: Get all settings groups
      responses:
        '200':
          description: List of settings groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SettingsGroup'
              example:
                - id: "11111111-1111-1111-1111-111111111111"
                  name: "general"
                  extensionId: null
                  settings:
                    - id: "22222222-2222-2222-2222-222222222222"
                      settingsGroupId: "11111111-1111-1111-1111-111111111111"
                      key: "instanceName"
                      value: "Magpie"

  /settings/groups/{extensionId}/{name}:
    get:
      operationId: GetSettingsGroupByKey
      tags: [Settings]
      summary: Get settings for an extension group
      parameters:
        - name: extensionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Settings group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsGroup'
              example:
                id: "11111111-1111-1111-1111-111111111111"
                name: "general"
                extensionId: "22222222-2222-2222-2222-222222222222"
                settings:
                  - id: "33333333-3333-3333-3333-333333333333"
                    settingsGroupId: "11111111-1111-1111-1111-111111111111"
                    key: "apiKey"
                    value: "your-api-key"
        '404':
          description: Settings group not found
    patch:
      operationId: PatchSettingsGroup
      tags: [Settings]
      summary: Update settings in an extension group
      parameters:
        - name: extensionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsGroupPatch'
      responses:
        '204':
          description: Settings updated
        '404':
          description: Settings group not found

  /settings/groups/system/{name}:
    get:
      operationId: GetSystemSettingsGroupByName
      tags: [Settings]
      summary: Get system settings for a group
      description: |
        Retrieves system settings for a named group.

        Common system settings groups:
        - `general`: General application settings (instance name, etc.)
        - `backups`: Scheduled backup settings (enabled, interval, retention)
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: The settings group name (e.g., "general", "backups")
      responses:
        '200':
          description: Settings group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsGroup'
              examples:
                general:
                  summary: General settings group
                  value:
                    id: "11111111-1111-1111-1111-111111111111"
                    name: "general"
                    extensionId: null
                    settings:
                      - id: "22222222-2222-2222-2222-222222222222"
                        settingsGroupId: "11111111-1111-1111-1111-111111111111"
                        key: "instanceName"
                        value: "Magpie"
                backups:
                  summary: Backup settings group
                  value:
                    id: "33333333-3333-3333-3333-333333333333"
                    name: "backups"
                    extensionId: null
                    settings:
                      - id: "44444444-4444-4444-4444-444444444444"
                        settingsGroupId: "33333333-3333-3333-3333-333333333333"
                        key: "enabled"
                        value: "true"
                      - id: "55555555-5555-5555-5555-555555555555"
                        settingsGroupId: "33333333-3333-3333-3333-333333333333"
                        key: "interval"
                        value: "daily"
                      - id: "66666666-6666-6666-6666-666666666666"
                        settingsGroupId: "33333333-3333-3333-3333-333333333333"
                        key: "retention"
                        value: "7"
        '404':
          description: Settings group not found
    patch:
      operationId: PatchSystemSettingsGroup
      tags: [Settings]
      summary: Update system settings in a group
      description: |
        Updates system settings in a named group using patch operations.

        For backup settings (`backups` group), the following keys are supported:
        - `enabled`: Boolean string ("true" or "false") - enables/disables scheduled backups
        - `interval`: String - backup frequency ("daily", "weekly", "biweekly", "monthly")
        - `retention`: Number string - how many backups to keep (e.g., "7")
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: The settings group name (e.g., "general", "backups")
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsGroupPatch'
            examples:
              enableBackups:
                summary: Enable scheduled backups with daily interval
                value:
                  extensionId: null
                  name: "backups"
                  settings:
                    add:
                      enabled: "true"
                      interval: "daily"
                      retention: "7"
              updateBackupInterval:
                summary: Update backup interval to weekly
                value:
                  extensionId: null
                  name: "backups"
                  settings:
                    update:
                      interval: "weekly"
              disableBackups:
                summary: Disable scheduled backups
                value:
                  extensionId: null
                  name: "backups"
                  settings:
                    update:
                      enabled: "false"
      responses:
        '204':
          description: Settings updated
        '404':
          description: Settings group not found

  /indexers:
    get:
      operationId: GetAllIndexers
      tags: [Indexers]
      summary: Get all indexers
      responses:
        '200':
          description: List of indexers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Indexer'
              example:
                - id: "11111111-1111-1111-1111-111111111111"
                  name: "NZBGeek"
                  definitionId: "nzbgeek"
                  enabled: true
                  status: 0
                  lastCheckedAt: "2024-01-15T10:00:00Z"
                  settings: {}
                  tagIds: []
                  createdAt: "2024-01-01T00:00:00Z"
                  createdByUserId: null
                  modifiedAt: null
                  modifiedByUserId: null
    post:
      operationId: CreateIndexer
      tags: [Indexers]
      summary: Create a new indexer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Indexer'
      responses:
        '201':
          description: Indexer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Indexer'
              example:
                id: "22222222-2222-2222-2222-222222222222"
                name: "New Indexer"
                providerType: "newznab"
                availability: 1
                categories: ["Movies", "TV"]
                languages: ["en"]
                createdAt: "2024-01-15T10:30:00Z"
                createdByUserId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                modifiedAt: null
                modifiedByUserId: null
        '400':
          description: Bad request

  /indexers/{id}:
    get:
      operationId: GetIndexerById
      tags: [Indexers]
      summary: Get indexer by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Indexer details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Indexer'
              example:
                id: "11111111-1111-1111-1111-111111111111"
                name: "NZBGeek"
                providerType: "newznab"
                availability: 3
                categories: ["Movies", "TV", "Music"]
                languages: ["en"]
                createdAt: "2024-01-01T00:00:00Z"
                createdByUserId: null
                modifiedAt: null
                modifiedByUserId: null
        '404':
          description: Indexer not found
    patch:
      operationId: PatchIndexer
      tags: [Indexers]
      summary: Partially update an indexer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Indexer'
      responses:
        '204':
          description: Indexer updated
        '404':
          description: Indexer not found
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      operationId: DeleteIndexer
      tags: [Indexers]
      summary: Delete an indexer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Indexer deleted
        '404':
          description: Indexer not found

  /indexers/{id}/test:
    post:
      operationId: TestIndexer
      tags: [Indexers]
      summary: Test indexer connection

  /backups/{id}:
    delete:
      operationId: DeleteBackup
      tags: [Backups]
      summary: Delete a backup
      description: Permanently deletes a database backup. Admin only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Backup identifier
      responses:
        '204':
          description: Backup deleted
        '404':
          description: Backup not found

  /backups/{id}/restore:
    post:
      operationId: RestoreBackup
      tags: [Backups]
      summary: Restore from a backup
      description: |
        Restores the database from the specified backup. This will replace all current data.
        The application may need to restart after restore completes. Admin only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Backup identifier
      responses:
        '204':
          description: Restore initiated
        '404':
          description: Backup not found

  /backups/{id}/download:
    get:
      operationId: DownloadBackup
      tags: [Backups]
      summary: Download a backup file
      description: Downloads the backup file for offline storage. Admin only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Backup identifier
      responses:
        '200':
          description: Backup file download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Backup not found
        '501':
          description: Download not implemented
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  # File Browser
  /file-browser/contents:
    post:
      operationId: BrowseDirectory
      tags: [FileBrowser]
      summary: Browse a directory
      description: Returns the contents of a directory on the server's file system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileBrowserRequest'
      responses:
        '200':
          description: Directory contents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileSystemEntry'
              example:
                - name: "Documents"
                  path: "/home/user/Documents"
                  type: "folder"
                - name: "Downloads"
                  path: "/home/user/Downloads"
                  type: "folder"
                - name: "notes.txt"
                  path: "/home/user/notes.txt"
                  type: "file"
                  size: 1024
        '400':
          description: Invalid path or access denied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'


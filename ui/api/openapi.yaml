      type: object
      required: [slug, displayName, levelDefinitions]
      description: Defines a content type hierarchy structure from an extension
      properties:
        slug:
          type: string
          description: URL-safe identifier
        displayName:
          type: string
          description: Human-readable name
        levelDefinitions:
          type: array
          items:
            $ref: '#/components/schemas/ContentHierarchyLevelDefinition'


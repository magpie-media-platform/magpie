                updatesAvailable: 2
                extensions:
                  - id: "11111111-1111-1111-1111-111111111111"
                    name: "qBittorrent"
                    currentVersion: "2.1.0"
                    availableVersion: "2.2.0"
                    updateAvailable: true
                  - id: "22222222-2222-2222-2222-222222222222"

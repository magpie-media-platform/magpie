      operationId: ParseSubjectFilterQuery
      tags: [SubjectFilters]
      summary: Parse a subject filter query string into criteria
      description: |
        Parses a filter query string (e.g., "kind = Movie and genre has 'Sci-Fi'")
        into a SubjectFilterCriteria object. Returns 400 if the query has syntax errors.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterQueryParseRequest'
            example:
              query: "kind = Movie and genre has 'Sci-Fi'"
      responses:
        '200':
          description: Query parsed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectFilterCriteria'
        '400':
          description: Query parse error
          content:

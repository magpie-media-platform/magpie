    FulfillmentStatus:
      type: integer
      enum: [0, 1, 2, 3]
      description: |
        Content fulfillment status:
        * 0 - Missing (no media files)
        * 1 - Upgradable (has media files, open to upgrades)
        * 2 - Fulfilled (has media files, fully satisfied)
        * 3 - FulfilledExternally (fulfilled externally, no acquisition needed)


                name: "New API Key"
                key: "mg_abcdefghijklmnopqrstuvwxyz123456"
                keyPrefix: "mg_"
                enabled: true
                expiresAt: null
                createdAt: "2024-01-15T10:30:00Z"
                createdByUserId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api-keys/my/{id}:
    get:
      operationId: GetMyApiKey
      tags: [ApiKeys]
      summary: Get an API key by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: API key details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
              example:
                id: "11111111-1111-1111-1111-111111111111"
                userId: "22222222-2222-2222-2222-222222222222"
                name: "CLI Access"
                keyPrefix: "mg_"
                enabled: true
                expiresAt: null
                lastUsedAt: "2024-01-15T10:00:00Z"
                createdAt: "2024-01-01T00:00:00Z"
                createdByUserId: null
                modifiedAt: null
                modifiedByUserId: null
        '404':
          description: API key not found
    delete:
      operationId: DeleteMyApiKey
      tags: [ApiKeys]
      summary: Delete an API key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: API key deleted
        '404':
          description: API key not found

  /api-keys/my/{id}/enable:
    post:
      operationId: EnableMyApiKey
      tags: [ApiKeys]
      summary: Enable an API key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: API key enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
        '404':
          description: API key not found

  /api-keys/my/{id}/disable:
    post:
      operationId: DisableMyApiKey
      tags: [ApiKeys]
      summary: Disable an API key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: API key disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
        '404':
          description: API key not found

  /api-keys/my/{id}/rotate:
    post:
      operationId: RotateMyApiKey
      tags: [ApiKeys]
      summary: Rotate an API key (regenerate the secret)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: API key rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreatedResponse'
              example:
                id: "11111111-1111-1111-1111-111111111111"
                userId: "22222222-2222-2222-2222-222222222222"
                name: "CLI Access"
                key: "mg_newrotatedkeyvalue123456789012"
                keyPrefix: "mg_"
                enabled: true
                expiresAt: null
                createdAt: "2024-01-01T00:00:00Z"
        '404':
          description: API key not found

  /api-keys/{userId}:
    get:
      operationId: GetUserApiKeys
      tags: [ApiKeys]
      summary: Get API keys for a user (admin)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKey'
        '404':
          description: User not found

  /api-keys/{userId}/{id}:
    get:
      operationId: GetUserApiKey
      tags: [ApiKeys]
      summary: Get a specific API key for a user (admin)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: API key details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
        '404':
          description: API key not found
    delete:
      operationId: DeleteUserApiKey
      tags: [ApiKeys]
      summary: Delete a user's API key (admin)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: API key deleted
        '404':
          description: API key not found

  # Releases
  /releases:
    get:
      operationId: GetAllReleases
      tags: [Releases]
      summary: Get all releases
      parameters:
        - name: indexerId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by indexer ID
        - name: contentItemId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by content item ID
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 25
      responses:
        '200':
          description: Paged list of releases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedReleases'
              example:
                items:
                  - id: "11111111-1111-1111-1111-111111111111"
                    indexerId: "22222222-2222-2222-2222-222222222222"
                    contentItemId: null
                    protocol: "usenet"
                    externalId: "abc123"
                    title: "Movie.2024.1080p.BluRay.x264"
                    publishDate: "2024-01-15T10:00:00Z"
                    size: 5368709120
                    infoUrl: "https://example.com/release/123"
                    categories: ["Movies", "HD"]
                    languages: ["en"]
                    properties: null
                    createdAt: "2024-01-15T10:00:00Z"
                    createdByUserId: null
                    modifiedAt: null
                    modifiedByUserId: null
                pageNumber: 1
                pageSize: 25
                totalItems: 100

  /releases/{id}:
    get:
      operationId: GetReleaseById
      tags: [Releases]
      summary: Get release by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Release details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
              example:
                id: "11111111-1111-1111-1111-111111111111"
                indexerId: "22222222-2222-2222-2222-222222222222"
                contentItemId: null
                protocol: "usenet"
                externalId: "abc123"
                title: "Movie.2024.1080p.BluRay.x264"
                publishDate: "2024-01-15T10:00:00Z"
                size: 5368709120
                infoUrl: "https://example.com/release/123"
                categories: ["Movies", "HD"]
                languages: ["en"]
                properties: null
                createdAt: "2024-01-15T10:00:00Z"
                createdByUserId: null
                modifiedAt: null
                modifiedByUserId: null
        '404':
          description: Release not found

  /auth/login/providers:
    get:
      operationId: GetLoginProviders
      tags: [Auth]
      summary: List available authentication providers
      description: |
        Returns the list of authentication providers available on the login page.
        This is a public endpoint - no authentication required.
      responses:
        '200':
          description: List of authentication providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoginProviderResponse'

  /auth/login:
    post:
      operationId: AuthLogin
      tags: [Auth]
      summary: Authenticate user with credentials
      description: |
        Authenticates a user with username and password.
        Returns access and refresh tokens on success.
        This is a public endpoint - no authentication required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
              example:
                accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                accessTokenExpiresAt: "2100-01-01T00:00:00Z"
                refreshToken: "ZXhhbXBsZS1yZWZyZXNoLXRva2VuLXZhbHVlLWZvci1tb2NrLXNlcnZlci0wMDAwMDE="
        '400':
          description: Invalid request (missing username or password)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Invalid credentials
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/logout:
    post:
      operationId: AuthLogout
      tags: [Auth]
      summary: Log out the current user
      description: |
        Revokes the refresh token, invalidating the user's session.
        Requires authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Logout successful
        '400':
          description: Invalid request (missing refresh token)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/refresh:
    post:
      operationId: AuthRefresh
      tags: [Auth]
      summary: Refresh access token
      description: |
        Uses a valid refresh token to obtain a new access token.
        The old refresh token is revoked and a new one is issued.
        This is a public endpoint - no authentication required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refresh successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
              example:
                accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                accessTokenExpiresAt: "2024-01-15T12:30:00Z"
                refreshToken: "ZXhhbXBsZS1yZWZyZXNoLXRva2VuLXZhbHVlLWZvci1tb2NrLXNlcnZlci0wMDAwMDI="
        '400':
          description: Invalid request (missing refresh token)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Invalid or expired refresh token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  schemas:
    # Backup schemas
    BackupInfo:
      type: object
      required: [id, name, createdAt, sizeBytes]
      description: Information about a database backup
      properties:
        id:
          type: string
          description: Backup identifier (timestamp-based)
        name:
          type: string
          description: Human-readable backup name
        createdAt:
          type: string
          format: date-time
          description: When the backup was created
        sizeBytes:
          type: integer
          format: int64
          description: Size of the backup file in bytes

    BackupCreateRequest:
      type: object
      description: Request to create a database backup
      properties:
        name:
          type: string
          nullable: true
          description: Optional name for the backup. If not provided, a timestamp-based name is generated.

    BackupCreateResponse:
      type: object
      required: [id]
      description: Response from creating a database backup
      properties:
        id:
          type: string
          description: The backup identifier

    # File Browser schemas
    FileBrowserRequest:
      type: object
      description: Request to browse a directory
      properties:
        path:
          type: string
          description: Directory path to browse. Defaults to system root.
          default: "/"

    FileSystemEntry:
      type: object
      required: [name, path, type]
      description: A file or folder entry in the file system
      properties:
        name:
          type: string
          description: Display name of the file or folder
        path:
          type: string
          description: Full path to the file or folder
        type:
          type: string
          enum: [file, folder]
          description: Entry type
        size:
          type: integer
          format: int64
          nullable: true
          description: File size in bytes (only present for files)

    # Common schemas
    SortDirection:
      type: integer
      enum: [0, 1, 2]
      description: Sort direction (None=0, Ascending=1, Descending=2)

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: healthy

    ServiceHealthResponse:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          description: The service name
        status:
          type: string
          description: The health status (healthy, unhealthy, degraded)
        message:
          type: string
          nullable: true
          description: Optional descriptive message
        responseTimeMs:
          type: integer
          format: int64
          nullable: true
          description: Response time in milliseconds

    SystemInfo:
      type: object
      required: [version, runtime, operatingSystem, architecture, systemRoot, nodeId, startedAt]
      properties:
        version:
          type: string
        runtime:
          type: string
        operatingSystem:
          type: string
        architecture:
          type: string
        systemRoot:
          type: string
        nodeId:
          type: string
        startedAt:
          type: string
          format: date-time

    DiskSpaceInfo:
      type: object
      required: [id, name, path, totalBytes, freeBytes, usedBytes]
      properties:
        id:
          type: string
          format: uuid
          description: Root folder ID
        name:
          type: string
          description: Root folder display name
        path:
          type: string
          description: Filesystem path
        totalBytes:
          type: integer
          format: int64
          description: Total space in bytes on the drive
        freeBytes:
          type: integer
          format: int64
          description: Free space in bytes on the drive
        usedBytes:
          type: integer
          format: int64
          description: Used space in bytes (totalBytes - freeBytes)

    Role:
      type: integer
      enum: [0, 1, 2, 3]
      description: |
        User role:
        * 0 - Viewer (read-only)
        * 1 - Requester (can request content)
        * 2 - Manager (content management)
        * 3 - Admin (full access)

    LoginRequest:
      type: object
      required: [username, password]
      description: Request to log in with credentials
      properties:
        username:
          type: string
          description: The username of the user
        password:
          type: string
          format: password
          description: The password for the user

    LogoutRequest:
      type: object
      required: [refreshToken]
      description: Request to log out and revoke refresh token
      properties:
        refreshToken:
          type: string
          description: The refresh token to revoke

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      description: Request to refresh the access token
      properties:
        refreshToken:
          type: string
          description: The refresh token

    LoginProviderResponse:
      type: object
      required: [id, name, type, usesCredentials]
      description: An authentication provider available on the login page
      properties:
        id:
          type: string
          description: Unique identifier for the provider
        name:
          type: string
          description: Display name for the provider
        type:
          type: string
          enum: [local, oidc, ldap, saml]
          description: Provider type
        usesCredentials:
          type: boolean
          description: Whether this provider collects a username and password
        iconHint:
          type: string
          nullable: true
          description: Optional icon hint used by the UI to select a brand icon

    AuthTokenResponse:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken]
      description: Response containing authentication tokens
      properties:
        accessToken:
          type: string
          description: The JWT access token
        accessTokenExpiresAt:
          type: string
          format: date-time
          description: When the access token expires
        refreshToken:
          type: string
          description: The refresh token for obtaining new access tokens

    User:
      type: object
      required: [id, username, providerType, enabled, role, failedLoginAttempts, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          nullable: true
        extensionId:
          type: string
          format: uuid
          nullable: true
          description: The extension that defines the authentication provider
        providerType:
          type: string
          description: The type of authentication provider
        externalId:
          type: string
          nullable: true
        settings:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: Provider-specific settings
        enabled:
          type: boolean
        role:
          $ref: '#/components/schemas/Role'
        failedLoginAttempts:
          type: integer
          description: Number of consecutive failed login attempts
        lockedUntil:
          type: string
          format: date-time
          nullable: true
          description: When the account lockout expires
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        createdByUserId:
          type: string
          format: uuid
          nullable: true
        modifiedAt:
          type: string
          format: date-time
          nullable: true
        modifiedByUserId:
          type: string
          format: uuid
          nullable: true

    UserPatch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        enabled:
          type: object
          properties:
            value:
              type: boolean
        role:
          type: object
          properties:
            value:
              $ref: '#/components/schemas/Role'

    UserCreate:
      type: object
      required: [username, password, role]
      description: Arguments for creating a local user
      properties:
        username:
          type: string
          description: The username for the new user
        password:
          type: string
          description: The plaintext password for the new user (hashed server-side over TLS)
        role:
          $ref: '#/components/schemas/Role'
          description: The role for the new user

    PagedUsers:
      type: object
      required: [items, pageNumber, pageSize, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pageNumber:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer

    Tag:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: The tag name (unique identifier)

    TagsPatch:
      type: object
      description: Patch for updating tags on an entity
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the entity to patch (set from path parameter)
        tags:
          $ref: '#/components/schemas/StringSetPatch'
          nullable: true
          description: Tags to add or remove

    StringSetPatch:
      type: object
      description: A patch for sets of string values with add and remove operations
      properties:
        add:
          type: array
          items:
            type: string
          description: Items to add to the collection
        remove:
          type: array
          items:
            type: string
          description: Items to remove from the collection

    RootFolder:
      type: object
      required: [id, name, path, contentTypeId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        path:
          type: string
        contentTypeId:
          type: string
          format: uuid
          description: The content type this folder stores
        createdAt:
          type: string
          format: date-time
        createdByUserId:
          type: string
          format: uuid
          nullable: true
        modifiedAt:
          type: string
          format: date-time
          nullable: true
        modifiedByUserId:
          type: string
          format: uuid
          nullable: true

    Setting:
      type: object
      required: [id, settingsGroupId, key, value, createdAt]
      properties:
        id:
          type: string
          format: uuid
        settingsGroupId:
          type: string
          format: uuid
        key:
          type: string
        value:
          type: string
        createdAt:
          type: string
          format: date-time
        createdByUserId:
          type: string
          format: uuid
          nullable: true
        modifiedAt:
          type: string
          format: date-time
          nullable: true
        modifiedByUserId:
          type: string
          format: uuid
          nullable: true

    SettingsGroup:
      type: object
      required: [id, name, createdAt, settings]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: The name of the group, unique per extension
        extensionId:
          type: string
          format: uuid
          nullable: true
          description: The extension this settings group belongs to (null for system settings)
        createdAt:
          type: string
          format: date-time
        createdByUserId:
          type: string
          format: uuid
          nullable: true
        modifiedAt:
          type: string
          format: date-time
          nullable: true
        modifiedByUserId:
          type: string
          format: uuid
          nullable: true
        settings:
          type: array
          items:
            $ref: '#/components/schemas/Setting'

    SettingsGroupPatch:
      type: object
      properties:
        extensionId:
          type: string
          format: uuid
          nullable: true
          description: The extension ID (null for system settings)
        name:
          type: string
          description: The settings group name
        settings:
          $ref: '#/components/schemas/DictionaryPatchStringString'

    DictionaryPatchStringString:
      type: object
      description: A patch operation for string key-value pairs
      properties:
        add:
          type: object
          additionalProperties:
            type: string
          description: Settings to add
        remove:
          type: array
          items:
            type: string
          description: Keys of settings to remove
        update:
          type: object
          additionalProperties:
            type: string
          description: Settings to update (key -> new value)

    IndexerStatus:
      type: integer
      enum: [0, 1, 2, 3]
      description: |
        Indexer status:
        * 0 - Unknown
        * 1 - Healthy
        * 2 - Unhealthy
        * 3 - Stale

    IndexerAvailability:
      type: integer
      enum: [0, 1, 2, 3]
      description: |
        Indexer availability:
        * 0 - Unknown
        * 1 - Public
        * 2 - Private
        * 3 - SemiPrivate

    Indexer:
      type: object
      required: [id, providerType, name, availability, createdAt]
      description: A searchable index of releases
      properties:
        id:
          type: string
          format: uuid
        feedId:
          type: string
          format: uuid
          nullable: true
          description: The feed the indexer was synchronized from
        extensionId:
          type: string
          format: uuid
          nullable: true
          description: The extension that defines the indexer provider
        providerType:
          type: string
          description: The indexer provider type
        name:
          type: string
        description:
          type: string
          nullable: true
        availability:
          $ref: '#/components/schemas/IndexerAvailability'
        categories:
          type: array
          items:
            type: string
          description: Categories the indexer supports
        languages:
          type: array
          items:
            type: string
          description: Languages the indexer supports
        createdAt:
          type: string
          format: date-time
        createdByUserId:
          type: string
          format: uuid
          nullable: true
        modifiedAt:
          type: string
          format: date-time
          nullable: true
        modifiedByUserId:
          type: string
          format: uuid
          nullable: true

    IndexerConnection:
      type: object
      required: [id, indexerId, name, enabled, status, createdAt]
      description: A configured connection to an indexer
      properties:
        id:
          type: string
          format: uuid
        indexerId:
          type: string
          format: uuid
        name:
          type: string
        enabled:
          type: boolean
        status:
          $ref: '#/components/schemas/IndexerStatus'
        settings:
          type: object
          additionalProperties:
            type: string
        lastChecked:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        createdByUserId:
          type: string
          format: uuid
          nullable: true
        modifiedAt:
          type: string
          format: date-time
          nullable: true
        modifiedByUserId:
          type: string
          format: uuid
          nullable: true

    IndexerConnectionPatch:
      type: object
      properties:

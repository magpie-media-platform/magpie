      tags: [Extensions]
      summary: Install an extension from a file upload
      description: |
        Upload a .dll or .nupkg file to install an extension manually.
        The file will be validated and the extension metadata will be extracted.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The extension file (.dll or .nupkg)
      responses:
        '201':
          description: Extension installed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Extension'
              example:
                id: "ext-custom"
                name: "Custom Extension"
                version: "1.0.0"
                filePath: "/extensions/custom.dll"
                assemblyName: "Custom.Extension"
                enabled: true
                managed: false
                installed: true
                createdAt: "2024-01-15T10:30:00Z"
        '400':
          description: Bad request (invalid file or metadata)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: Unsupported file type (only .dll and .nupkg are supported)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '501':
          description: Not implemented
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'


<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" href="/favicon.ico" sizes="32x32" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <meta name="theme-color" content="#1a1b26" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Magpie" />
        <style data-cascade-layer-order>
            @layer reset, base, components, utilities;
        </style>
        <script>
            try {
                const boot = JSON.parse(localStorage.getItem('magpie.theme.boot') ?? 'null');
                const light =
                    boot?.mode === 'Light' ||
                    (boot?.mode === 'System' && matchMedia('(prefers-color-scheme: light)').matches);
                const theme = boot?.[light ? 'Light' : 'Dark'];
                if (theme) {
                    const style = document.createElement('style');
                    style.dataset.themeStylesheet = theme.id;
                    style.textContent = theme.css;
                    document.head.appendChild(style);
                    document.documentElement.dataset.colorScheme = light ? 'light' : 'dark';
                    document.documentElement.dataset.theme = theme.id;
                    document.querySelector('meta[name="theme-color"]').content = theme.color;
                    if (light) {
                        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content =
                            'default';
                    }
                }
            } catch {}
        </script>
        <title>Magpie</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>

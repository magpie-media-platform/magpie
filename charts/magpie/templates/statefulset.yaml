{{- include "magpie.validate" . -}}
{{- $fullname := include "magpie.fullname" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
  annotations:
    magpie/mode: {{ include "magpie.mode" . }}
spec:
  serviceName: {{ $fullname }}
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "magpie.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "magpie.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      shareProcessNamespace: true
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: magpie
          image: {{ include "magpie.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- if .Values.cluster.enabled }}
            - name: Magpie__Cluster__Mode
              value: MultiNodeSharedExtensions
            {{- end }}
            - name: Magpie__Database__Provider
              value: {{ .Values.database.provider }}
            {{- if ne .Values.database.provider "sqlite" }}
            - name: Magpie__Database__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.connectionStringKey | quote }}
            {{- end }}
            {{- with .Values.secretKey.existingSecret }}
            - name: MAGPIE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.secretKey.key | quote }}
            {{- end }}
            {{- range $index, $proxy := .Values.knownProxies }}
            - name: Magpie__KnownProxies__{{ $index }}
              value: {{ $proxy | quote }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            {{- if .Values.keys.existingSecret }}
            - name: keys
              mountPath: /app/data/keys
              readOnly: true
            {{- else if .Values.cluster.enabled }}
            - name: shared
              mountPath: /app/data/keys
              subPath: keys
            {{- end }}
            {{- if .Values.cluster.enabled }}
            - name: shared
              mountPath: /app/data/extensions
              subPath: extensions
            - name: shared
              mountPath: /app/data/backups
              subPath: backups
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.persistence.data.existingClaim .Values.keys.existingSecret .Values.cluster.enabled .Values.extraVolumes }}
      volumes:
        {{- with .Values.persistence.data.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ . | quote }}
        {{- end }}
        {{- with .Values.keys.existingSecret }}
        - name: keys
          secret:
            secretName: {{ . | quote }}
            defaultMode: 0444
        {{- end }}
        {{- if .Values.cluster.enabled }}
        - name: shared
          {{- with .Values.persistence.shared.volume }}
          {{- toYaml . | nindent 10 }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.shared.existingClaim | quote }}
          {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
  {{- if not .Values.persistence.data.existingClaim }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.persistence.data.accessModes | nindent 10 }}
        {{- with .Values.persistence.data.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.data.size }}
  {{- end }}

name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  CONTRACT_PROJECTS: Magpie.Models Magpie.Sdk
  EXTENSION_PROJECTS: >-
    Magpie.Extensions.Books
    Magpie.Extensions.Cardigann
    Magpie.Extensions.Jellyfin
    Magpie.Extensions.MediaInfo.FFProbe
    Magpie.Extensions.Movies
    Magpie.Extensions.Music
    Magpie.Extensions.MusicBrainz
    Magpie.Extensions.OpenLibrary
    Magpie.Extensions.Qbittorrent
    Magpie.Extensions.Tmdb
    Magpie.Extensions.Tv
    Magpie.Extensions.Tvmaze
    Magpie.Extensions.Wikidata

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Set version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>[-<prerelease>]." >&2
              exit 1
            fi
          else
            version="$(dotnet msbuild src/Magpie.Sdk/Magpie.Sdk.csproj -getProperty:Version)"
            if [[ "$GITHUB_REF" == refs/heads/develop ]]; then
              version="${version%%-*}-dev.$GITHUB_RUN_NUMBER"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build src/Magpie.sln -c Release -p:Version="$VERSION"

      - name: Test
        run: dotnet test src/Magpie.sln -c Release --no-build

      - name: Verify UI
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm run verify-full

  pack:
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - run: bash scripts/pack-packages.sh "$VERSION" artifacts/packages $CONTRACT_PROJECTS $EXTENSION_PROJECTS

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/*.nupkg

  app:
    needs: build
    strategy:
      matrix:
        include:
          - rid: win-x64
            runner: ubuntu-latest
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-latest
          - rid: osx-arm64
            runner: macos-latest
          - rid: osx-x64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.build.outputs.version }}
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - run: bash scripts/package-app.sh "$VERSION" "$RID" artifacts/app

      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.rid }}
          path: artifacts/app/*.tar.gz

  installer:
    needs: [build, pack, app]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v8
        with:
          name: app-win-x64
          path: artifacts/app

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/packages

      - run: >
          bash scripts/package-installer.sh "$VERSION" "artifacts/app/magpie-$VERSION-win-x64.tar.gz"
          artifacts/packages artifacts/installer $EXTENSION_PROJECTS

      - run: bash scripts/verify-installer.sh "artifacts/installer/magpie-$VERSION-win-x64.msi" $EXTENSION_PROJECTS

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: artifacts/installer/*.msi

  image:
    needs: [build, pack, app]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            rid: linux-x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.build.outputs.version }}
      ARCH: ${{ matrix.arch }}
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: app-${{ matrix.rid }}
          path: artifacts/app

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/packages

      - name: Install the Standard extension packages
        run: |
          mkdir -p artifacts/image/extensions
          for project in $EXTENSION_PROJECTS; do
            package="artifacts/packages/$project.$VERSION.nupkg"
            if [ "$(unzip -Z1 "$package" 'lib/*' | cut -d/ -f2 | sort -u | wc -l)" -ne 1 ]; then
              echo "$package does not have exactly one lib folder" >&2
              exit 1
            fi
            unzip -q "$package" 'lib/*' '*.nuspec' -d "artifacts/image/extensions/$project"
          done

      - name: Build images
        run: |
          mkdir -p artifacts/image/app
          tar -xzf "artifacts/app/magpie-$VERSION-$RID.tar.gz" -C artifacts/image/app
          docker build --platform "linux/$ARCH" --file Dockerfile --target standard --tag "magpie:$VERSION" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            artifacts/image
          docker build --platform "linux/$ARCH" --file Dockerfile --target bare --tag "magpie:$VERSION-bare" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            artifacts/image
          docker build --platform "linux/$ARCH" --file Dockerfile --target postgresql --tag "magpie:$VERSION-postgresql" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            artifacts/image

      - run: bash scripts/verify-images.sh "$VERSION" $EXTENSION_PROJECTS

      - run: docker save "magpie:$VERSION" "magpie:$VERSION-bare" "magpie:$VERSION-postgresql" | gzip > "artifacts/magpie-$VERSION-image-$ARCH.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.arch }}
          path: artifacts/magpie-*-image-*.tar.gz

  verify:
    needs: [build, pack, app]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/packages

      - uses: actions/download-artifact@v8
        with:
          name: app-linux-x64
          path: artifacts/app

      - run: >
          bash scripts/verify-artifacts.sh "$VERSION"
          "artifacts/app/magpie-$VERSION-linux-x64.tar.gz" artifacts/packages

  chart:
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.4

      - name: Install kubeconform
        run: |
          archive="$RUNNER_TEMP/kubeconform.tar.gz"
          url=https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          curl -fsSLo "$archive" "$url"
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  $archive" | sha256sum --check
          sudo tar -xzf "$archive" -C /usr/local/bin kubeconform

      - run: bash scripts/verify-chart.sh charts/magpie

      - run: helm package charts/magpie --version "$VERSION" --app-version "$VERSION" --destination artifacts/chart

      - uses: actions/upload-artifact@v7
        with:
          name: chart
          path: artifacts/chart/*.tgz

  publish:
    needs: [build, pack, app, installer, image, verify, chart]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')) &&
      github.repository == 'magpie-media-platform/magpie'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require the tagged commit on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Authenticate to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet packages
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

      - name: Publish image
        env:
          MAGPIE_IMAGE: ghcr.io/magpie-media-platform/magpie
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          echo "$REGISTRY_PASSWORD" | docker login "${MAGPIE_IMAGE%%/*}" --username "$REGISTRY_USERNAME" --password-stdin
          suffixes=("" -bare -postgresql)
          for arch in amd64 arm64; do
            docker load --input "artifacts/image-$arch/magpie-$VERSION-image-$arch.tar.gz"
            for suffix in "${suffixes[@]}"; do
              docker tag "magpie:$VERSION$suffix" "$MAGPIE_IMAGE:$VERSION$suffix-$arch"
              docker push "$MAGPIE_IMAGE:$VERSION$suffix-$arch"
            done
          done
          for suffix in "${suffixes[@]}"; do
            docker buildx imagetools create --tag "$MAGPIE_IMAGE:$VERSION$suffix" \
              "$MAGPIE_IMAGE:$VERSION$suffix-amd64" "$MAGPIE_IMAGE:$VERSION$suffix-arm64"
            if [[ "$VERSION" != *-* ]]; then
              docker buildx imagetools create --tag "$MAGPIE_IMAGE:latest$suffix" "$MAGPIE_IMAGE:$VERSION$suffix"
            fi
          done

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.4

      - name: Publish chart
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          echo "$REGISTRY_PASSWORD" | helm registry login ghcr.io --username "$REGISTRY_USERNAME" --password-stdin
          helm push "artifacts/chart/magpie-$VERSION.tgz" oci://ghcr.io/magpie-media-platform/charts

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          release_args=(--verify-tag)
          if [[ "$GITHUB_REF" == refs/heads/develop ]]; then
            tag="v$VERSION"
            release_args=(--target "$GITHUB_SHA")
          fi
          if [[ "$VERSION" == *-* ]]; then
            release_args+=(--prerelease --latest=false)
          fi
          gh release create "$tag" artifacts/app-*/*.tar.gz artifacts/installer/*.msi artifacts/chart/*.tgz \
            --title "$VERSION" --notes "" "${release_args[@]}"

name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  CONTRACT_PROJECTS: Magpie.Models Magpie.Sdk
  EXTENSION_PROJECTS: >-
    Magpie.Extensions.Books
    Magpie.Extensions.Cardigann
    Magpie.Extensions.Jellyfin
    Magpie.Extensions.MediaInfo.FFProbe
    Magpie.Extensions.Movies
    Magpie.Extensions.Music
    Magpie.Extensions.MusicBrainz
    Magpie.Extensions.OpenLibrary
    Magpie.Extensions.Qbittorrent
    Magpie.Extensions.Tmdb
    Magpie.Extensions.Tv
    Magpie.Extensions.Tvmaze
    Magpie.Extensions.Wikidata

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Set version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>[-<prerelease>]." >&2
              exit 1
            fi
          else
            version="$(dotnet msbuild src/Magpie.Sdk/Magpie.Sdk.csproj -getProperty:Version)"
            if [[ "$GITHUB_REF" == refs/heads/develop ]]; then
              version="${version%%-*}-dev.$GITHUB_RUN_NUMBER"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build src/Magpie.sln -c Release -p:Version="$VERSION"

      - name: Test
        run: dotnet test src/Magpie.sln -c Release --no-build

      - name: Verify UI
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm run verify-full

  pack:
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - run: bash scripts/pack-packages.sh "$VERSION" artifacts/packages $CONTRACT_PROJECTS $EXTENSION_PROJECTS

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/*.nupkg

  app:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64]
    env:
      VERSION: ${{ needs.build.outputs.version }}
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - run: bash scripts/package-app.sh "$VERSION" "$RID" artifacts/app

      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.rid }}
          path: artifacts/app/*.tar.gz

  installer:
    needs: [build, pack, app]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v8
        with:
          name: app-win-x64
          path: artifacts/app

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/packages

      - run: >
          bash scripts/package-installer.sh "$VERSION" "artifacts/app/magpie-$VERSION-win-x64.tar.gz"
          artifacts/packages artifacts/installer $EXTENSION_PROJECTS

      - run: bash scripts/verify-installer.sh "artifacts/installer/magpie-$VERSION-win-x64.msi" $EXTENSION_PROJECTS

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: artifacts/installer/*.msi

  image:
    needs: [build, pack, app]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: app-linux-x64
          path: artifacts/app

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/packages

      - name: Install the Standard extension packages
        run: |
          mkdir -p artifacts/image/extensions
          for project in $EXTENSION_PROJECTS; do
            package="artifacts/packages/$project.$VERSION.nupkg"
            if [ "$(unzip -Z1 "$package" 'lib/*' | cut -d/ -f2 | sort -u | wc -l)" -ne 1 ]; then
              echo "$package does not have exactly one lib folder" >&2
              exit 1
            fi
            unzip -q "$package" 'lib/*' '*.nuspec' -d "artifacts/image/extensions/$project"
          done

      - name: Build images
        run: |
          mkdir -p artifacts/image/app
          tar -xzf "artifacts/app/magpie-$VERSION-linux-x64.tar.gz" -C artifacts/image/app
          docker build --platform linux/amd64 --file Dockerfile --target standard --tag "magpie:$VERSION" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            artifacts/image
          docker build --platform linux/amd64 --file Dockerfile --target bare --tag "magpie:$VERSION-bare" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            artifacts/image

      - run: bash scripts/verify-images.sh "$VERSION" $EXTENSION_PROJECTS

      - run: docker save "magpie:$VERSION" "magpie:$VERSION-bare" | gzip > "artifacts/magpie-$VERSION-image.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: artifacts/magpie-*-image.tar.gz

  verify:
    needs: [build, pack, app]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/packages

      - uses: actions/download-artifact@v8
        with:
          name: app-linux-x64
          path: artifacts/app

      - run: >
          bash scripts/verify-artifacts.sh "$VERSION"
          "artifacts/app/magpie-$VERSION-linux-x64.tar.gz" artifacts/packages

  publish:
    needs: [build, pack, app, installer, image, verify]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')) &&
      github.repository == 'magpie-media-platform/magpie'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require the tagged commit on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Authenticate to NuGet
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

      - name: Publish image
        env:
          MAGPIE_IMAGE: ghcr.io/magpie-media-platform/magpie
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          docker load --input "artifacts/image/magpie-$VERSION-image.tar.gz"
          echo "$REGISTRY_PASSWORD" | docker login "${MAGPIE_IMAGE%%/*}" --username "$REGISTRY_USERNAME" --password-stdin
          for tag in "$VERSION" "$VERSION-bare"; do
            docker tag "magpie:$tag" "$MAGPIE_IMAGE:$tag"
            docker push "$MAGPIE_IMAGE:$tag"
          done
          if [[ "$VERSION" != *-* ]]; then
            docker tag "magpie:$VERSION" "$MAGPIE_IMAGE:latest"
            docker push "$MAGPIE_IMAGE:latest"
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          release_args=(--verify-tag)
          if [[ "$GITHUB_REF" == refs/heads/develop ]]; then
            tag="v$VERSION"
            release_args=(--target "$GITHUB_SHA")
          fi
          if [[ "$VERSION" == *-* ]]; then
            release_args+=(--prerelease --latest=false)
          fi
          gh release create "$tag" artifacts/app-*/*.tar.gz artifacts/installer/*.msi \
            --title "$VERSION" --notes "" "${release_args[@]}"
